name: pr-rules

# PR templates cannot require fields the way issue forms can, so the one
# standing rule that is machine-checkable is enforced here: a change to the
# document must be accompanied by a changelog entry explaining it.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Document changes require a changelog entry
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          echo "Files changed:"; echo "$CHANGED" | sed 's/^/  /'

          DOC=$(echo "$CHANGED" | grep -c '^ai-timelines-and-outcomes\.md$' || true)
          LOG=$(echo "$CHANGED" | grep -c '^CHANGELOG\.md$' || true)

          if [ "$DOC" -gt 0 ] && [ "$LOG" -eq 0 ]; then
            echo ""
            echo "FAIL: ai-timelines-and-outcomes.md changed without a CHANGELOG.md entry."
            echo ""
            echo "The log is the substance, not paperwork. A revision whose reasoning"
            echo "is not recorded cannot be argued with later, which is the whole point"
            echo "of the document. See CONTRIBUTING.md."
            exit 1
          fi

          REF=$(echo "$CHANGED" | grep -c '^REFERENCES\.md$' || true)
          if [ "$DOC" -gt 0 ] && [ "$REF" -eq 0 ]; then
            echo ""
            echo "NOTE: document changed but REFERENCES.md did not."
            echo "If a source was added or a claim re-sourced, REFERENCES.md and"
            echo "check.py's source list both need updating. check.py will catch"
            echo "a named source missing from REFERENCES, but not a newly named"
            echo "source absent from its own hardcoded list."
          fi

          echo ""
          echo "OK"
