name: Tripwire proposal
description: Propose a tripwire — especially one phrased on observable effects that would have caught a past miss.
labels: ["tripwire", "finding"]
body:
  - type: markdown
    attributes:
      value: |
        **This is the most valuable contribution available.**

        Three tripwires were written *after* a development the existing set failed to anticipate: 15 after OpenAI's voluntary disclosure framework fell outside the evaluator-or-victim binary in 6 and 7; 16 after Dream-RSI demonstrated a self-improvement loop firing neither 3 nor 4; 2b after the AI Futures Project downgraded the metric tripwire 1 depends on.

        The shared diagnosis: **tripwires phrased on mechanisms get bypassed by mechanisms nobody enumerated in advance.** A tripwire phrased on an observable *effect* — something measurable regardless of how it comes about — is more durable.

        Writing a rule after seeing the event it covers is not pre-registration. The value of a proposal here is that it is dated before the thing it would catch.

  - type: textarea
    id: observable
    attributes:
      label: The observable
      description: A named, published, checkable series or event class. Not "capability increases" but something a stranger could look up and agree on.
    validations:
      required: true

  - type: textarea
    id: threshold
    attributes:
      label: The threshold
      description: |
        A specific value, and where it sits relative to the current reading. Tripwire 1 was originally set at a value the metric already satisfied, so it would have fired on the status quo — state the current baseline and show your threshold is clear of it.
    validations:
      required: true

  - type: textarea
    id: update
    attributes:
      label: The update
      description: Which estimate moves, in which direction, by roughly how much. Pre-registering the magnitude is what distinguishes this from a watchlist.
    validations:
      required: true

  - type: dropdown
    id: covers
    attributes:
      label: Would this have caught one of the three misses?
      options:
        - "Yes — the OpenAI proactive disclosure case (now tripwire 15)"
        - "Yes — the Dream-RSI frozen-weight loop case (now tripwire 16)"
        - "Yes — the time-horizon downgrade case (now tripwire 2b)"
        - "No — this covers something none of the existing set addresses"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why this is phrased on effects rather than mechanisms
      description: If a new mechanism produced the same effect, would your tripwire still fire? Explain.
    validations:
      required: true
